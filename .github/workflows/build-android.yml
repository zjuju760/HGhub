name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    tags: ["v*"]

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK 与 NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 原生工程
        run: pnpm tauri android init --ci

      - name: 编译 APK（支持 aarch64、armv7、x86_64）
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64

      - name: 签名 APK（自动兼容免 Secret 或自定义签名）
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          mkdir -p artifacts
          KS="$RUNNER_TEMP/keystore.jks"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo ">>> 使用仓库配置的 Secret Keystore 签名"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            SIGN_ALIAS="$KEY_ALIAS"
            SIGN_STORE_PASS="$STORE_PASSWORD"
            SIGN_KEY_PASS="$KEY_PASSWORD"
          else
            echo ">>> 未配置 Secret Keystore，自动生成临时 Debug 签名证书"
            keytool -genkey -v -keystore "$KS" -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=HGhubDebug,O=HGhub,C=CN"
            SIGN_ALIAS="androiddebugkey"
            SIGN_STORE_PASS="android"
            SIGN_KEY_PASS="android"
          fi

          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            out="artifacts/HGhub_${VERSION}_${abi}.apk"
            echo ">>> 正在签名: $f -> $out"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$SIGN_ALIAS" \
              --ks-pass "pass:$SIGN_STORE_PASS" --key-pass "pass:$SIGN_KEY_PASS" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -3
            found=$((found+1))
          done
          rm -f "$KS"

          if [ "$found" -eq 0 ]; then
            echo "::error::未找到编译输出的 release APK"
            exit 1
          fi

          echo ">>> 打包并签名完成，输出文件列表："
          ls -lh artifacts

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-Android-APK-${{ steps.ver.outputs.version }}
          path: artifacts/*.apk
          if-no-files-found: error
